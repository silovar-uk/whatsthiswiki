<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f3efe4">
  <meta name="description" content="Wikipediaの記事を、目次だけで当てるクイズ。ログインなしで遊び、同じ問題をURLで共有できます。">
  <meta property="og:title" content="What's This Wiki?">
  <meta property="og:description" content="目次だけで、何の記事？ ログインなしのWikipediaクイズ。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <title>What's This Wiki?｜目次だけで何の記事？</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="./" aria-label="トップへ戻る">
        <span class="brand-mark">W?</span>
        <span>
          <strong>What's This Wiki?</strong>
          <small>目次だけで、何の記事？</small>
        </span>
      </a>
      <button id="share-header" class="button button-quiet is-hidden" type="button">この問題を共有</button>
    </header>

    <main id="app" class="app" aria-live="polite"></main>

    <footer class="site-footer">
      <p>Wikipediaの記事情報を利用しています。回答後に元記事へのリンクを表示します。</p>
      <p>非公式サービスであり、Wikimedia FoundationおよびQuizKnockとは関係ありません。</p>
    </footer>
  </div>

  <template id="loading-template">
    <section class="panel loading-panel">
      <div class="spinner" aria-hidden="true"></div>
      <p data-loading-message>問題を準備中…</p>
      <small>良問になりそうな記事だけを選んでいます。</small>
    </section>
  </template>

  <script type="module" src="./app.js"></script>
</body>
</html>
